# Akler settings. See doc/METRICS.md for metric definitions.
# Missing settings use built-in defaults. # starts a comment.

[weights]
# Bigger weights make a pattern matter more. Rewards lower the score.
# Full and half jumps split adjacent and nonadjacent fingers.
# FSB/FSS and HSB/HSS duplicate adjacent discordant jumps.
# These weights also drive ranker SCORE.
# Same-finger movement
sfb = 12
sfs = 4

# Discordant full jumps: adjacent fingers, then nonadjacent fingers.
daFJB = 6
daFJS = 1.5
dnFJB = 2
dnFJS = 0.5

# Concordant full jumps: adjacent fingers, then nonadjacent fingers.
caFJB = 2
caFJS = 0.5
cnFJB = 1
cnFJS = 0.25

# Half jumps get a small penalty; full jumps matter much more.
# Discordant half jumps: adjacent fingers, then nonadjacent fingers.
daHJB = 0.2
daHJS = 0.05
dnHJB = 0.1
dnHJS = 0.025

# Concordant half jumps: adjacent fingers, then nonadjacent fingers.
caHJB = 0.1
caHJS = 0.025
cnHJB = 0.05
cnHJS = 0.0125

# Lateral stretches
lsb = 3
lss = 0.75

# Redirects
red  = 0.75
wred = 2.25 # extra for no index finger; total penalty 3
wish = 0.75 # extra for index plus ring/pinky; total penalty 1.5

# Same-key repeats, shown but unweighted
skb = 0 # consecutive presses
sks = 0 # one press between

# Rewards for comfortable patterns. Inward and outward directions can differ.
insraf_reward = 0.40
outsraf_reward = 0.20
inroll = 0.2
outroll = 0.10
alt_reward = 0.10

# Travel is measured in key units per 100 presses or adjacent pairs. Lower is better.
# Each non-thumb finger's home key is its assigned physical key on the home row.
# TRAVEL: straight-line distance from each pressed key to that finger's home key.
# Example: TRAVEL 35 means 35 key units of reach for every 100 presses.
travel = 0.1
# SFTRAVEL: distance between consecutive keys pressed by the same finger.
# Other adjacent pairs count as zero. Thumb presses add no travel.
sftravel = 2
# VTRAVEL: up/down distance from each pressed key to that finger's home key.
# LTRAVEL: left/right distance from each pressed key to that finger's home key.
# TRAVEL already includes both directions; do not add these values to it.
vtravel = 0
ltravel = 0

# Off-home finger use
off_pinky  = 2
off_ring   = 0.4
off_middle = 0.05
off_index  = 0.15

# Finger usage across all presses.
usage_pinky  = 0.2
usage_ring   = 0.04
usage_middle = 0.01
usage_index  = 0.03

[mana2]
# Progressive schedules alternate slope and upper boundary in brackets.
# Negative slopes penalize a stat; positive slopes reward it.
# Example: [-4, 0.5, -13, 1, -26] scores the first 0.5 at -4,
# the next 0.5 at -13, and anything above 1 at -26.
# Finger usage
finger-usage-LP = [0, 13, -1]
finger-usage-LR = [0, 13, -0.7]
finger-usage-LM = [0, 13, -0.7]
finger-usage-LI = [0, 13, -0.7]
finger-usage-LT = [0]
finger-usage-RT = [0]
finger-usage-RI = [0, 13, -0.7]
finger-usage-RM = [0, 13, -0.7]
finger-usage-RR = [0, 13, -0.7]
finger-usage-RP = [0, 13, -1]
offpinky = [-0.5]
pinkyringcurl = [-22]

# Bigram movement
sfb = [0]
sfbw = [-4, 0.5, -13, 1, -26]
skb = [-4, 0.5, -13, 1, -26]
lsb = [-1, 1.5, -2, 3.5, -4]
vsb = [-2, 1.7, -4]

# Skipgram movement
sfs = [0]
sfsw = [-2, 2, -8.2]
sks = [-2, 2, -8.2]
lss = [-0.4, 3.4, -1.2, 3.8, -2.5]
vss = [-1.5, 3, -3, 3.5, -6]

# Alternations and redirects
alt = [0]
altnothumbs = [-0.1]
altsfs = [0]
altsfsnothumbs = [0]
redirect = [0]
redirectnothumbs = [-1]
redirectsfs = [0]
redirectsfsnothumbs = [0]
redirectweak = [-10, 0.3, -20]
redirectweaknothumbs = [0]
redirectsfsweak = [-20]
redirectsfsweaknothumbs = [0]

# Rolls
roll = [0]
rollnothumbs = [0]
inroll2 = [0.1]
inroll2nothumbs = [-0.1]
outroll2 = [0]
outroll2nothumbs = [0]
inroll3 = [0.1]
inroll3nothumbs = [-0.1]
outroll3 = [0]
outroll3nothumbs = [0]
goodroll = [0]
goodrollnothumbs = [0.3]

[search]
# Search controls shared by ordinary and magic optimizers.
# Magic now honors these settings, including the default hybrid 30-second budget.
method = hybrid
restarts = 12
passes = 80
anneal_steps = 6000
temperature_start = 0.6
temperature_end = 0.003
cycle_probability = 0.2
seconds = 30
seed = 0x8a5c3d9127e4b6f1
archive = 12

# Increases allowed relative to the original layout; none disables a cap.
# SFB/SFS use percentage points; travel caps use key units per 100 presses.
max_sfb_increase = 0.08
max_sfs_increase = 0.12
max_travel_increase = none
max_sftravel_increase = none

# design: refine, random, evolve.
# Scoring modes: detailed or mana2.
# Mana2 schedules are configured in [mana2] above.
# Choosing a preset in the UI applies its mode and caps; loading preset here does not.
design = refine
mode = detailed
preset = custom
min_distance = 6

# Optional training-corpus mixture. Default: selected corpus only.
# corpus.reddit = 1
# corpus.books = 0.5

[rolls]
# Applies to both directional roll rewards and every displayed roll column.
# Thumb inclusion changes only the roll denominator, not other rhythm metrics.
include_thumbs = true
# false rejects rolls with this movement on consecutive pairs AB or BC.
include_scissors = false
include_stretches = false

[ranker]
# Visible columns, in the ranker's fixed order. Hidden columns still score.
columns = SCORE SFB SFS TRAVEL SFTRAVEL FSB FSS LSB LSS WRED WISH SRAF INSRAF OUTSRAF IN2 OUT2 IN3 OUT3
# In mana2 mode, append chosen stat columns to your list, for example:
# columns = SCORE SFB SFS TRAVEL SFTRAVEL FSB FSS LSB LSS WRED WISH SRAF INSRAF OUTSRAF IN2 OUT2 IN3 OUT3 finger-usage-LP offpinky sfbw inroll2 goodrollnothumbs

[ngrams]
# Include n-grams containing space in evaluation and optimization.
# false filters them when loading the corpus; the stored corpus is unchanged.
include_spacegrams = true
# all preserves the complete corpus. A positive count is an APPROXIMATION,
# applied in memory when loading a corpus; it does not rewrite the corpus file.
# Each order has its own limit. Action contexts must retain their lower-order
# suffix dependencies; higher-order retained counts can be below these caps.
# Limited contexts can change mapping, metrics, scores and optimized layouts.
# Example (opt-in): trigrams = 5000
#                   trigrams = all
trigrams = 5000
tetragrams = 5000
pentagrams = 5000
