# Akler settings. See doc/METRICS.md for metric definitions.
# Missing settings use built-in defaults. # starts a comment.

[weights]
# Bigger weights make a pattern matter more. Rewards lower the score.
# Full and half jumps split adjacent and nonadjacent fingers.
# FSB/FSS and HSB/HSS duplicate adjacent discordant jumps.
# These weights also drive ranker SCORE.
# Same-finger movement
sfb = 12
sfs = 4

# Disconcordant (non)adjacent full jump bigram and skipgram
daFJB = 4.8
daFJS = 1.2
dnFJB = 3.2
dnFJS = 0.8

# Concordant (non)adjacent full jump bigram and skipgram
caFJB = 2.4
caFJS = 0.6
cnFJB = 1.6
cnFJS = 0.4

# Disconcordant (non)adjacent half jump bigram and skipgram
daHJB = 1.2
daHJS = 0.3
dnHJB = 0.8
dnHJS = 0.2

# Concordant (non)adjacent half jump bigram and skipgram
caHJB = 0.6
caHJS = 0.15
cnHJB = 0.4
cnHJS = 0.1

# Lateral stretches
lsb = 4
lss = 0.8

# Redirects
red = 0.75
wred = 2.5 # no index finger
wish = 1.25 # index plus ring or pinky

# Same-key repeats, shown but unweighted
skb = 0 # consecutive presses
sks = 0 # one press between

# Rewards for comfortable patterns. Inward and outward directions can differ.
insraf_reward = 0.30
outsraf_reward = 0.30
inroll = 0.10
outroll = 0.10
alt_reward = 0.05

# Finger travel (key units per 100 presses)
travel = 0.02
vtravel = 0
ltravel = 0
sftravel = 0.1

# Off-home finger use
off_pinky  = 1.0
off_ring   = 0.3
off_middle = 0.05
off_index  = 0.15

# Finger usage across all presses.
usage_pinky  = 0.3
usage_ring   = 0.1
usage_middle = 0.0
usage_index  = 0.005

[search]
# Search controls shared by ordinary and magic optimizers.
# Magic now honors these settings, including the default hybrid 30-second budget.
method = hybrid
restarts = 12
passes = 80
anneal_steps = 6000
temperature_start = 0.3
temperature_end = 0.003
cycle_probability = 0.2
seconds = 30
seed = 0x8a5c3d9127e4b6f1
archive = 12

# Increases allowed relative to the original layout; none disables a cap.
# SFB/SFS use percentage points; travel caps use key units per 100 presses.
max_sfb_increase = 0
max_sfs_increase = 0
max_travel_increase = none
max_sftravel_increase = none

# design: refine, random, evolve. mode: detailed, simple.
# preset records the selected preset; explicit values below remain authoritative.
design = refine
mode = detailed
preset = custom
min_distance = 6

# Used by either optimizer in simple mode.
simple_sfb = 12
simple_sfs = 4
simple_lateral = 2
simple_row1 = 0.75 # 1u row jump
simple_row2 = 2    # 2u row jump
simple_insraf_reward = 0.3
simple_outsraf_reward = 0.3
simple_inroll_reward = 0.1
simple_outroll_reward = 0.1

# Optional training-corpus mixture. Default: selected corpus only.
# corpus.reddit = 1
# corpus.books = 0.5

[rolls]
# Applies to both directional roll rewards and every displayed roll column.
# Thumb inclusion changes only the roll denominator, not other rhythm metrics.
include_thumbs = true
# false rejects rolls with this movement on consecutive pairs AB or BC.
include_scissors = true
include_stretches = true

[ranker]
# Visible columns, in the ranker's fixed order. Hidden columns still score.
columns = SCORE SFB SFS TRAVEL SFTRAVEL LSB LSS RED daFJB caFJB daFJS caFJS daHJB caHJB daHJS caHJS

[ngrams]
# all preserves the complete corpus. A positive count is an APPROXIMATION,
# applied in memory when loading a corpus; it does not rewrite the corpus file.
# Each order has its own limit. Action contexts must retain their lower-order
# suffix dependencies; higher-order retained counts can be below these caps.
# Limited contexts can change mapping, metrics, scores and optimized layouts.
# Example (opt-in): trigrams = 2000
#                   trigrams = all
trigrams = 5000
tetragrams = 5000
pentagrams = 5000
