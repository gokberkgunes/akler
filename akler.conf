# akler settings, read from the current working directory.
# See doc/USAGE.md for controls and doc/METRICS.md for metric definitions.
# This file is authoritative: layouter.conf and older optimizer-*.conf/
# ranker-columns.conf files are read only when akler.conf is absent.
# Missing keys use built-in defaults.
# Optimizer setup: s saves weights/search; ranker: v then s saves columns.
# Values are unchanged from the built-in defaults. # starts a comment.

[weights]
# Detailed objective = weighted penalties - weighted preferences.
# Nonnegative finite weights. FSB/FSS are display totals: weight their D/C
# components below, not the totals. These weights also drive ranker SCORE.
sfb = 12
sfs = 1.5
hsb = 1
hss = 0.4
lsb = 3
lss = 0.75
dsb = 1
dss = 0.25
red = 0.75
wred = 2.5
wish = 1.25
osf = 0.5
sraf_reward = 0.3
# Combined IN2 + OUT2 + IN3 + OUT3 credit; breakdown columns are unweighted.
roll_reward = 0.10
dfsb = 4
cfsb = 2
dfss = 1.5
cfss = 0.75
alt_reward = 0.05
csb = 0.5
css = 0.15
travel = 0.02
vtravel = 0
ltravel = 0
sftravel = 0.1
off_pinky = 0.6
off_ring = 0.2
off_middle = 0.05
off_index = 0

[search]
# Search controls shared by ordinary and magic optimizers.
# Magic now honors these settings, including the default hybrid 30-second budget.
method = hybrid
restarts = 12
passes = 80
anneal_steps = 6000
temperature_start = 0.3
temperature_end = 0.003
cycle_probability = 0.2
seconds = 30
seed = 0x8a5c3d9127e4b6f1
archive = 12

# Increases allowed relative to the original layout; none disables a cap.
# SFB/SFS use percentage points; travel caps use key units per 100 presses.
max_sfb_increase = 0
max_sfs_increase = 0
max_travel_increase = none
max_sftravel_increase = none

# design: refine, random, evolve. mode: detailed, simple.
# preset records the selected preset; explicit values below remain authoritative.
design = refine
mode = detailed
preset = custom
min_distance = 6

# Used by either optimizer in simple mode.
simple_sfb = 12
simple_sfs = 1.5
simple_lateral = 2
simple_row1 = 0.75
simple_row2 = 2
simple_sraf_reward = 0.25
simple_roll_reward = 0.25

# Optional training-corpus mixture. Default: selected corpus only.
# corpus.reddit = 1
# corpus.books = 0.5

[rolls]
# Applies to all roll columns and the combined roll reward in both objectives.
# Thumb inclusion changes only the roll denominator, not other rhythm metrics.
include_thumbs = true
# false rejects rolls with this movement on consecutive pairs AB or BC.
include_scissors = true
include_stretches = true

[ranker]
# Visible columns, in the ranker's fixed order. Hidden columns still score.
columns = SCORE SFB SFS TRAVEL SFTRAVEL FSB HSB FSS HSS LSB LSS RED SRAF ROLL INROLL OUTROLL ALT VTRAVEL LTRAVEL COVERAGE

[ngrams]
# all preserves the complete corpus. A positive count is an APPROXIMATION,
# applied in memory when loading a corpus; it does not rewrite the corpus file.
# Each order has its own limit. Action contexts must retain their lower-order
# suffix dependencies; higher-order retained counts can be below these caps.
# Limited contexts can change mapping, metrics, scores and optimized layouts.
# Example (opt-in): trigrams = 2000
trigrams = 5000
tetragrams = 5000
pentagrams = 5000
