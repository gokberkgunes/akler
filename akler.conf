# Akler settings. See doc/METRICS.md for metric definitions.
# Missing settings use built-in defaults. # starts a comment.

[weights]
# Bigger weights make a pattern matter more. Rewards lower the score.

# Full and half jumps split adjacent and nonadjacent fingers.
# FSB/FSS and HSB/HSS duplicate adjacent discordant jumps.

# Same-finger movement
sfb = 12
sfs = 4

# Discordant full jumps: adjacent fingers, then nonadjacent fingers.
daFJB = 6 # FSB
dnFJB = 3
caFJB = 4
cnFJB = 1

# Concordant full jumps: adjacent fingers, then nonadjacent fingers.
daFJS = 1.5 # FSS
dnFJS = 0.75
caFJS = 1
cnFJS = 0.25

# Full and half jumps have separate weights.
# Discordant half jumps: adjacent fingers, then nonadjacent fingers.
daHJB = 1.2 # HSB
dnHJB = 0.8
caHJB = 0.8
cnHJB = 0.2

# Concordant half jumps: adjacent fingers, then nonadjacent fingers.
daHJS = 0.4
dnHJS = 0.2
caHJS = 0.2
cnHJS = 0.05

# Lateral stretches
lsb = 4
lss = 1

# Redirects
red  = 1.0
wred = 12 # added to RED; weak redirects cost 22.5 in total
wish = 0 # added to RED; index plus ring/pinky redirects cost 0.5

# Same-key repeats, shown but unweighted
skb = 0.5 # consecutive presses
sks = 0 # one press between

# Rewards for comfortable patterns. Inward and outward directions can differ.
insraf_reward = 0.3
outsraf_reward = 0
inroll = 0.1
outroll = 0
# Alternating hands: LRL or RLR, including same-finger returns and jumps.
alt_reward = 0.1

# Travel is measured in key units per 100 presses or adjacent pairs. Lower is better.
# Each non-thumb finger's home key is its assigned physical key on the home row.
# TRAVEL: straight-line distance from each pressed key to that finger's home key.
# Example: TRAVEL 35 means 35 key units of reach for every 100 presses.
travel = 0.05
# SFTRAVEL: distance between consecutive keys pressed by the same finger.
# Other adjacent pairs count as zero. Thumb presses add no travel.
sftravel = 0.1
# VTRAVEL: up/down distance from each pressed key to that finger's home key.
# LTRAVEL: left/right distance from each pressed key to that finger's home key.
# TRAVEL already includes both directions; do not add these values to it.
vtravel = 0.2
ltravel = 0.5

# Off-home finger use
off_pinky  = 2
off_ring   = 0.6
off_middle = 0.05
off_index  = 0.15

# Finger usage across all presses.
usage_pinky  = 0.5
usage_ring   = 0.2
usage_middle = 0.01
usage_index  = 0.02

[aklgg]
# Used when search.mode = aklgg. Each setting weights one value from the
# akl.gg table. Negative values penalize it, positive values reward it, and
# 0 only reports it. Bigram and skipgram weights are independent.

# Pair statistics: consecutive presses (bigram) and one skipped press (skipgram).
sfb = -3 # Same Finger
sfs = -2
skb = 0 # Same Key
sks = 0
lsb = -1 # Stretch
lss = -0.4
vsb = -1 # Scissor
vss = -0.4

# Three-press hand patterns. "nothumbs" excludes triples containing a thumb;
# "sfs" means matching endpoint fingers. Patterns overlap as in akl.gg.
alt = 0
altnothumbs = 0
altsfs = 0
altsfsnothumbs = 0
redirect = -0.8
redirectnothumbs = 0
redirectsfs = 0
redirectsfsnothumbs = 0
redirectweak = -1
redirectweaknothumbs = 0
redirectsfsweak = 0
redirectsfsweaknothumbs = 0
roll = 0.2
rollnothumbs = 0
inroll2 = 0.05
inroll2nothumbs = 0
outroll2 = -0.05
outroll2nothumbs = 0
inroll3 = 0.1
inroll3nothumbs = 0
outroll3 = -0.15
outroll3nothumbs = 0

# Percent of all presses made by each finger. Any weight can be a schedule
# [slope, boundary, slope, ...]: e.g. [0, 6, -4] is free up to 6% of presses,
# then -4 per extra percent. Equal values on every finger add a constant.
# Pinkies: free up to 6% of presses, then -4 per extra percent. Without this
# the optimizer loads each pinky like an index finger (about 8.5%).
finger-usage-LP = [0, 6, -4]
finger-usage-LR = 0
finger-usage-LM = 0
finger-usage-LI = 0
finger-usage-LT = 0
finger-usage-RT = 0
finger-usage-RI = 0
finger-usage-RM = 0
finger-usage-RR = 0
finger-usage-RP = [0, 6, -4]
# Native Mana2 stats not shown in akl.gg's table.
offpinky = -0.6 # percent of presses made by a pinky off its home key
pinkyringcurl = 0
sfbw = 0
sfsw = 0
goodroll = 0
goodrollnothumbs = 0

# Speed: how far each finger travels between its own consecutive presses
# (bigrams, plus skipgrams at half weight). Weighted divides each finger's
# Fspeed by its strength, so pinky movement costs about 3.7x index movement.
# weighted_speed is the all-finger Weighted total akl.gg optimizes. Per-finger
# rows add on top of it, so a movement weighted in both is charged twice.
fspeed = 0
weighted_speed = -0.8
fspeed-LP = 0
fspeed-LR = 0
fspeed-LM = 0
fspeed-LI = 0
fspeed-LT = 0
fspeed-RT = 0
fspeed-RI = 0
fspeed-RM = 0
fspeed-RR = 0
fspeed-RP = 0
weighted-speed-LP = 0
weighted-speed-LR = 0
weighted-speed-LM = 0
weighted-speed-LI = 0
weighted-speed-LT = 0
weighted-speed-RT = 0
weighted-speed-RI = 0
weighted-speed-RM = 0
weighted-speed-RR = 0
weighted-speed-RP = 0

[typing]
# Use a layout's context-specific alternate finger assignments when available.
# false keeps each physical key on its normal fingermap finger.
alt_fingers = false
# Use declared combos as one simultaneous chord press.
# Every key adds finger usage; movement touching the chord is excluded.
combos = false

[alts]
# Alternate fingers by key position (doc/ALTFINGERS.md), used while [typing]
# alt_fingers is true by layouts without their own rules. Keys are named by the
# QWERTY key in that place; _ is any key between. "rt r_t (LM LI)" presses r
# with the left middle and t with the left index finger. rowstag applies to
# row-staggered boards, colstag to all others.
# Index column on the middle finger next to the inner column, both orders.
colstag = fg f_g fb f_b  (LM LI) gf g_f bf b_f (LI LM)
#colstag = rg r_g fg f_g fb f_b vb v_b (LM LI) gr g_r gf g_f bf b_f bv b_v (LI LM)
# rowstag = rt r_t (LM LI)

[search]
# Search controls shared by ordinary and magic optimizers.
method = hybrid
# Independent CPU searches. 0 uses the available CPU count; 1 is serial.
workers = 16
# Restarts run in rounds of `workers`; use a multiple of it. On finch with
# combos, 64 restarts beat 16 by about 1.5 points and matched 128. In the
# magic/action optimizers, restarts after the first round that fall behind
# the first round's best quarter are abandoned early, which saves time.
restarts = 64
passes = 160
# Annealing steps per restart for the ordinary optimizer.
anneal_steps = 30000
# Annealing steps per restart for the magic and action optimizers. On finch
# with combos 12000 beat 3000 by about 4 points; more steps gained less than
# more restarts in the same time.
magic_anneal_steps = 12000
temperature_start = 3.00
temperature_end = 0.003
cycle_probability = 0.4
# A ceiling: runs end when their restarts are done (finch with combos: about
# 65 s for 64 restarts; magic layouts take longer).
seconds = 180
seed = 0x8a5c3d9127e4b703
archive = 12

# Increases allowed relative to the original layout; none disables a cap.
# SFB/SFS use percentage points; travel caps use key units per 100 presses.
# Zero prevents improving the score by making these stats worse.
# These caps use AKLER definitions. Magic/action optimizers may pass above a
# cap while annealing (20 points per unit above it) so their rule, combo and
# swap fits can bring the layout back under; only results within every cap
# are kept.
max_sfb_increase = 0.04
max_sfs_increase = 0.08
max_travel_increase = none
max_sftravel_increase = none

# design: refine, random, evolve.
# normal uses AKLER definitions and [weights]; aklgg uses the akl.gg table
# definitions and [aklgg].
# SCORE = penalties minus rewards, including off-home and finger-usage costs.
# Choosing a preset applies its caps; loading a preset name here does not.
design = refine
mode = normal
preset = custom
min_distance = 6

# Optional training-corpus mixture. Default: selected corpus only.
# corpus.reddit = 1
# corpus.books = 0.5

[magic]
# Default magic locations exclude pinky and ring fingers on both hands.
allowed_fingers = LM LI RI RM LT RT
# Exact physical locations override fingers: e.g. 1:3 2:4.
# Rows and columns start at 1; columns include outer keys when present.
# all or an empty value uses allowed_fingers.
allowed_keys = all
# Most rules one magic key may hold.
max_rules = 5
# Screened candidate rules given a full evaluation in each refit.
shortlist = 24

[combos]
# A combo types its output on its own keys: a+b -> "je" types je by pressing a
# and b at once, as one chord press (as on keyboards and akl.gg). With
# fatfingering = true, the optimizers may also fit combos on two up-down or
# left-right neighbours on one finger.
fatfingering = false
# Combos the action and magic optimizers fit (with [typing] combos on): two
# keys on neighbouring fingers in one row typing a costly bigram, plus
# same-finger neighbours when fatfingering is true. 0 leaves combos as they
# are; otherwise max counts every combo, the layout's own included (the least
# useful are dropped first). Press c in the optimizer to open the action
# optimizer for a plain layout.
max = 3
# true fits exactly max combos (as many as there are candidates) even where
# fewer would score better; false fits up to max. Settings: Combos exact.
exact = false
# Most frequent candidate chords given exact trials in each fitting round.
shortlist = 12

[adaptive]
# Adaptive swaps the action and magic optimizers fit: `swap C XY` makes the X
# and Y keys exchange outputs right after C, so a same-finger bigram "C X" is
# typed on Y's key instead. Refitted with magic rules and combos between
# annealing chunks. max counts every swap, the layout's own included (the
# least useful are dropped first); 0 leaves a layout's swaps as they are.
max = 5
# true fits exactly max swaps (as many as there are candidates); false fits
# up to max. Settings: Swaps exact.
exact = false
# Candidate swaps given exact trials in each fitting round.
shortlist = 12

[rolls]
# Applies to both directional roll rewards and every displayed roll column.
# Including thumbs changes roll counts and their denominator.
# Other rhythm metrics keep their non-thumb definitions.
include_thumbs = false
# false rejects rolls with this movement on consecutive pairs AB or BC.
include_scissors = false
include_stretches = false

[ranker]
# Hidden layout paths are stored in ranker-hidden.json.
# Visible columns, in the ranker's fixed order. Hidden columns still score.
columns = SCORE SFBS SKBS FSBS HSBS FJBS HJBS LSBS daFJBS caFJBS dnFJBS cnFJBS daHJBS caHJBS dnHJBS cnHJBS

hide_magic = false
hide_non_thumb = false

[ngrams]
# A spacegram is a stored n-gram containing Space: e␠, ␠t, or e␠t.
# Include them in evaluation and optimization. This changes populations and
# denominators, not a separate score weight. Press z in editor/ranker to toggle.
# false filters them while loading; it cannot restore data absent from source.
include_spacegrams = true
# all preserves the complete corpus. A positive count is an APPROXIMATION,
# applied in memory when loading a corpus; it does not rewrite the corpus file.
# Each order has its own limit. Action contexts must retain their lower-order
# suffix dependencies; higher-order retained counts can be below these caps.
# Limited contexts can change mapping, metrics, scores and optimized layouts.
# Example (opt-in): trigrams = 5000
#                   trigrams = all
trigrams = 8000
tetragrams = 5000
pentagrams = 5000
