# Akler settings. See doc/METRICS.md for metric definitions.
# Missing settings use built-in defaults. # starts a comment.

[weights]
# Bigger weights make a pattern matter more. Rewards lower the score.
# Full and half jumps split adjacent and nonadjacent fingers.
# FSB/FSS and HSB/HSS duplicate adjacent discordant jumps.
# These weights also drive ranker SCORE.
# Same-finger movement
sfb = 12
sfs = 4

# Discordant full jumps: adjacent fingers, then nonadjacent fingers.
daFJB = 6
daFJS = 1.5
dnFJB = 2
dnFJS = 0.5

# Concordant full jumps: adjacent fingers, then nonadjacent fingers.
caFJB = 2
caFJS = 0.5
cnFJB = 1
cnFJS = 0.25

# Half jumps get a small penalty; full jumps matter much more.
# Discordant half jumps: adjacent fingers, then nonadjacent fingers.
daHJB = 0.2
daHJS = 0.05
dnHJB = 0.1
dnHJS = 0.025

# Concordant half jumps: adjacent fingers, then nonadjacent fingers.
caHJB = 0.1
caHJS = 0.025
cnHJB = 0.05
cnHJS = 0.0125

# Lateral stretches
lsb = 3
lss = 0.75

# Redirects
red  = 0.75
wred = 2.25 # extra for no index finger; total penalty 3
wish = 0.75 # extra for index plus ring/pinky; total penalty 1.5

# Same-key repeats, shown but unweighted
skb = 0 # consecutive presses
sks = 0 # one press between

# Rewards for comfortable patterns. Inward and outward directions can differ.
insraf_reward = 0.40
outsraf_reward = 0.20
inroll = 0.2
outroll = 0.10
alt_reward = 0.10

# Travel is measured in key units per 100 presses or adjacent pairs. Lower is better.
# Each non-thumb finger's home key is its assigned physical key on the home row.
# TRAVEL: straight-line distance from each pressed key to that finger's home key.
# Example: TRAVEL 35 means 35 key units of reach for every 100 presses.
travel = 0.1
# SFTRAVEL: distance between consecutive keys pressed by the same finger.
# Other adjacent pairs count as zero. Thumb presses add no travel.
sftravel = 2
# VTRAVEL: up/down distance from each pressed key to that finger's home key.
# LTRAVEL: left/right distance from each pressed key to that finger's home key.
# TRAVEL already includes both directions; do not add these values to it.
vtravel = 0
ltravel = 0

# Off-home finger use
off_pinky  = 2
off_ring   = 0.4
off_middle = 0.05
off_index  = 0.15

# Finger usage across all presses.
usage_pinky  = 0.2
usage_ring   = 0.04
usage_middle = 0.01
usage_index  = 0.03

[mana2]
# Higher Mana2 score is better. Negative weights subtract points; positive add points.
# [0] measures the stat but gives it no score. [-2] subtracts 2 points per stat unit.
# Longer lists mean [weight, up_to, weight, up_to, weight].
# Example: [-4, 0.5, -13, 1, -26] applies -4 to the first 0.5 units,
# -13 to the next 0.5, and -26 above 1. A stat value of 2 gives -34.5 points.
# Most stats are percentages: 1 means 1%. SFBW/SFSW and stretch/scissor stats
# are movement ratings, not percentages; their boundaries use rating units.
# Stats overlap: a triple can earn roll, inroll3, goodroll and their no-thumb scores.
# "nothumbs" excludes triples containing any thumb; it still divides by all triples.
# Key examples below assume ordinary QWERTY finger assignments.

# Finger usage: percentage of all presses assigned to each finger.
# The first 13% is free on non-thumbs. 15% on LP costs (15 - 13) * 1 = 2 points.
finger-usage-LP = [0, 13, -1]    # Left pinky.
finger-usage-LR = [0, 13, -0.7]  # Left ring.
finger-usage-LM = [0, 13, -0.7]  # Left middle.
finger-usage-LI = [0, 13, -0.7]  # Left index.
finger-usage-LT = [0]           # Left thumb; usage is unpenalized.
finger-usage-RT = [0]           # Right thumb; usage is unpenalized.
finger-usage-RI = [0, 13, -0.7]  # Right index.
finger-usage-RM = [0, 13, -0.7]  # Right middle.
finger-usage-RR = [0, 13, -0.7]  # Right ring.
finger-usage-RP = [0, 13, -1]    # Right pinky.

# Physical y=1 is the second unshifted row; y=2 is the third unshifted row.
# These two stats test physical height, so vertical stagger affects them.
offpinky = [-0.5]      # Pinky presses at any physical y other than 1.
pinkyringcurl = [-22]  # Presses at y=2 using left pinky/middle or right ring/pinky.

# Bigram = two consecutive presses. Same-finger stats include thumbs.
sfb = [0]                         # Different positions, same finger: q-a.
# SFBW weights movement by distance and finger: pinky/thumb 2.5x, ring 1.3x, others 1x.
sfbw = [-4, 0.5, -13, 1, -26]      # Weighted SFB; same-position repeats do not count.
skb = [-4, 0.5, -13, 1, -26]       # Same position and finger: a-a.
# Stretch/scissor ratings use different non-thumb fingers on the same hand.
lsb = [-1, 1.5, -2, 3.5, -4]       # Horizontal stretch relative to finger separation.
vsb = [-2, 1.7, -4]                # Vertical scissor: finger pair, height and press order.

# Skipgram example: q-w-a compares q/a, skipping w.
# Ordinary layouts use stored skip pairs (middle press unknown), or derive from trigrams.
# Magic layouts derive skip pairs from mapped physical press histories.
sfs = [0]                         # Different endpoint positions, same finger: q-w-a.
sfsw = [-2, 2, -8.2]              # Weighted same-finger skip movement; like SFBW.
sks = [-2, 2, -8.2]               # Same endpoint position and finger: q-w-q.
lss = [-0.4, 3.4, -1.2, 3.8, -2.5] # Horizontal stretch between skip endpoints.
vss = [-1.5, 3, -3, 3.5, -6]      # Vertical scissor between skip endpoints.

# Alternations and redirects describe three presses.
# In these names, "sfs" means matching endpoint fingers; repeated keys count too.
alt = [0]                         # Hands alternate: left-right-left or right-left-right.
altnothumbs = [-0.1]               # Alternation with no thumb; e.g. q-p-w.
altsfs = [0]                      # Alternation with same endpoint finger: q-p-a or q-p-q.
altsfsnothumbs = [0]               # Same as altsfs, excluding thumbs.
redirect = [0]                    # One hand reverses finger direction: q-e-w.
redirectnothumbs = [-1]            # Redirect with no thumb.
redirectsfs = [0]                 # Redirect with same endpoint finger: q-w-a or q-w-q.
redirectsfsnothumbs = [0]          # Same as redirectsfs, excluding thumbs.
redirectweak = [-10, 0.3, -20]     # Redirect using only pinky/ring/middle; no index/thumb.
redirectweaknothumbs = [0]         # Same set as redirectweak; weak already excludes thumbs.
redirectsfsweak = [-20]            # Weak redirect with same endpoint finger: q-w-a.
redirectsfsweaknothumbs = [0]      # Same set as redirectsfsweak; no extra thumb cases.

# Inward goes pinky -> ring -> middle -> index -> thumb; outward goes the other way.
# "2" is a three-press mixed-hand pattern with a two-finger rolling part.
# "3" is a three-finger roll entirely on one hand. Neither is a two-press stat.
roll = [0]                        # Total inward/outward roll2 and roll3 patterns.
rollnothumbs = [0]                # All rolls, excluding triples containing a thumb.
inroll2 = [0.1]                   # Inward mixed-hand roll: q-w-p or p-q-w.
inroll2nothumbs = [-0.1]           # Same as inroll2, excluding thumbs.
outroll2 = [0]                    # Outward mixed-hand roll: w-q-p or p-w-q.
outroll2nothumbs = [0]             # Same as outroll2, excluding thumbs.
inroll3 = [0.1]                   # Inward one-hand roll: q-w-e or p-o-i.
inroll3nothumbs = [-0.1]           # Same as inroll3, excluding thumbs.
outroll3 = [0]                    # Outward one-hand roll: e-w-q or i-o-p.
outroll3nothumbs = [0]             # Same as outroll3, excluding thumbs.
# At these defaults, each inroll reward cancels its no-thumb penalty on thumb-free rolls.
goodroll = [0]                    # Any roll with zero scissor rating on both consecutive pairs.
goodrollnothumbs = [0.3]           # Good roll with no thumb; horizontal stretch can still count.

[search]
# Search controls shared by ordinary and magic optimizers.
# Magic now honors these settings, including the default hybrid 30-second budget.
method = hybrid
restarts = 12
passes = 80
anneal_steps = 6000
temperature_start = 0.6
temperature_end = 0.003
cycle_probability = 0.2
seconds = 30
seed = 0x8a5c3d9127e4b6f1
archive = 12

# Increases allowed relative to the original layout; none disables a cap.
# SFB/SFS use percentage points; travel caps use key units per 100 presses.
max_sfb_increase = 0.08
max_sfs_increase = 0.12
max_travel_increase = none
max_sftravel_increase = none

# design: refine, random, evolve.
# Scoring modes: detailed or mana2.
# Mana2 schedules are configured in [mana2] above.
# Choosing a preset in the UI applies its mode and caps; loading preset here does not.
design = refine
mode = detailed
preset = custom
min_distance = 6

# Optional training-corpus mixture. Default: selected corpus only.
# corpus.reddit = 1
# corpus.books = 0.5

[rolls]
# Applies to both directional roll rewards and every displayed roll column.
# Thumb inclusion changes only the roll denominator, not other rhythm metrics.
include_thumbs = true
# false rejects rolls with this movement on consecutive pairs AB or BC.
include_scissors = false
include_stretches = false

[ranker]
# Visible columns, in the ranker's fixed order. Hidden columns still score.
columns = SCORE SFB SFS TRAVEL SFTRAVEL FSB FSS LSB LSS WRED WISH SRAF INSRAF OUTSRAF IN2 OUT2 IN3 OUT3
# In mana2 mode, append chosen stat columns to your list, for example:
# columns = SCORE SFB SFS TRAVEL SFTRAVEL FSB FSS LSB LSS WRED WISH SRAF INSRAF OUTSRAF IN2 OUT2 IN3 OUT3 finger-usage-LP offpinky sfbw inroll2 goodrollnothumbs

[ngrams]
# Include n-grams containing space in evaluation and optimization.
# false filters them when loading the corpus; the stored corpus is unchanged.
include_spacegrams = true
# all preserves the complete corpus. A positive count is an APPROXIMATION,
# applied in memory when loading a corpus; it does not rewrite the corpus file.
# Each order has its own limit. Action contexts must retain their lower-order
# suffix dependencies; higher-order retained counts can be below these caps.
# Limited contexts can change mapping, metrics, scores and optimized layouts.
# Example (opt-in): trigrams = 5000
#                   trigrams = all
trigrams = 5000
tetragrams = 5000
pentagrams = 5000
